version: '3.8'

services:
  public-pool:
    container_name: public-pool
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Must stay longer than the save on shutdown (15 s); Docker's default is 10 s.
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${STRATUM_PORT}:${STRATUM_PORT}/tcp"
      - "127.0.0.1:${API_PORT}:${API_PORT}/tcp"
    volumes:
      - "./${NETWORK}-DB:/public-pool/DB"
      - "./.env:/public-pool/.env:ro"
    environment:
      - NODE_ENV=production
      # In the DB volume, so found blocks outlive the container.
      - SPLASH_FOUND_BLOCKS_DIR=/public-pool/DB/found-blocks

